[project]
name = "lumina"
version = "0.1.0"
description = "Lumina — orchestration layer over third-party generative models"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # `[email]` for EmailStr: an address that cannot receive mail is not an account, and
    # catching that at the schema is cheaper than at the first password reset.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "anthropic>=0.40",
    # Gemini, for translation. Small pure-python client; the async surface lives at
    # `client.aio`. See lumina.intelligence.translate.GeminiTranslator for why it leads.
    "google-genai>=2.3",
    "boto3>=1.35",
    "authlib>=1.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "stripe>=11.3",
    "structlog>=24.4",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
render = [
    "playwright>=1.49",
]
asr = [
    # Real speech-to-text for the Subtitles and Clip lanes. Optional because it is a large
    # install and downloads model weights on first use, and because the rest of the pipeline
    # runs without it — see lumina.execution.transcribe.
    "faster-whisper>=1.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.119",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-boto3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumina"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Alembic writes these; they are regenerated, not maintained, so holding them to the
# project's formatting only creates diff noise on every schema change.
extend-exclude = ["src/lumina/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# RUF001/2/3 flag characters that look like ASCII lookalikes. Inside the language packs the
# lookalikes are the subject: 。 and ， are the CJK punctuation the line-breaking rule is
# about, and "did you mean a comma?" is exactly the substitution that would break it. The
# packs are also the one place a script's own characters legitimately appear in source.
"src/lumina/intelligence/languages/*" = ["RUF001", "RUF002", "RUF003"]
"tests/languages/*" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# The Seamless workers run under the conda environment that has the CUDA build of torch, not
# under this project's own interpreter — that separation is the point of their being workers.
# Their imports are therefore correctly absent here.
module = ["torch.*", "torchaudio.*", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "stripe.*", "authlib.*", "faster_whisper.*", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lumina.db.migrations.versions.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
