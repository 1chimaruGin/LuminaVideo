<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060f" />
    <!-- The tab icon. Without these the browser draws its blank-page globe, which is how a
         pinned Lumina tab was indistinguishable from every other one. -->
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Matches the design prototype's faces. The Myanmar/JP/KR/SC/Thai families are here
         because the Identity kit screen lists those languages in their own scripts, and
         without them they render as tofu. The real app loads faces per language pack,
         on activation, never all bundled together. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400..600&family=Noto+Sans+Myanmar:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Lumina</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
